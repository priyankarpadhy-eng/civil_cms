app = "civil-dept-igit-backend"
primary_region = "bom" # Mumbai, closest to IGIT Sarang

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false # Keep it alive for the department
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
